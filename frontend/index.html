<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma 3 Chat — Ollama Web Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Боковая панель со списком сессий -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Gemma 3</h2>
                <button class="btn new-chat-btn" id="new-chat-btn" title="Новый чат">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"></path></svg>
                    Новый чат
                </button>
            </div>

            <div class="sidebar-search">
                <input type="text" id="session-search" placeholder="Поиск по чатам" autocomplete="off">
            </div>

            <div class="sessions-list" id="sessions-list">
                <!-- Сессии будут вставлены здесь -->
                <div class="empty-sessions">Сессий пока нет</div>
            </div>
        </aside>

        <!-- Основная область чата -->
        <main class="main">
            <header class="chat-header">
                <div class="header-left">
                    <button class="btn sidebar-toggle" id="sidebar-toggle" aria-label="Развернуть боковую панель">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="session-title" id="session-title">Выберите чат</h1>
                    <p class="session-subtitle" id="session-subtitle">Gemma 3 через Ollama</p>
                </div>
                <div class="header-right">
                    <button class="btn icon-btn" id="delete-session-btn" title="Удалить чат" style="display:none;">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            </header>

            <div class="empty-state" id="empty-state">
                <div class="empty-icon">
                    <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h3>Начните новый чат</h3>
                <p>Общайтесь с моделью Gemma 3, присылайте текст и фотографии.</p>
            </div>

            <div class="messages-area" id="messages-area" style="display:none;">
                <!-- Сообщения будут вставлены здесь -->
            </div>

            <form class="chat-form" id="chat-form">
                <div class="input-wrapper">
                    <button type="button" class="btn attach-btn" id="attach-btn" title="Прикрепить фото">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
                    </button>

                    <div class="preview-area" id="preview-area">
                        <!-- Предпросмотр изображений -->
                    </div>

                    <textarea id="message-input" rows="1" placeholder="Сообщение Gemma 3…" data-min-rows="1" data-max-rows="6"></textarea>

                    <div class="form-controls">
                        <span class="char-count" id="char-count">0</span>
                        <button type="submit" class="btn send-btn" id="send-btn" disabled>
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
